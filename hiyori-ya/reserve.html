<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="description" content="民宿ひより家のホームページです。">
	<meta name="viewport" content="width=device-width">
	<title>ひより家 | ご予約フォーム</title>
	<link rel="stylesheet" href="css/reset.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/sp.css">
	<link rel="icon" href="image/favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=New+Tegomin&display=swap" rel="stylesheet">
</head>

<body>
	<header class="header">
		<div class="wrapper" id="header-in">
			<h1><a href="index.html"><img src="image/logo_mark.svg" alt="民宿ひより家" width="70px"></a></h1>
			<nav>
				<input id="sp_gnavi_check" type="checkbox">
				<label id="sp_gnavi_btn" for="sp_gnavi_check"><span></span></label>
				<ul>
					<li id="reserve"class="now"><a href="reserve.html" ><img src="image/to_reserve.svg" alt="ご予約はこちら" height="20px"></li>
					<li><a href="plan.html"><img src="image/plan.svg" alt="ご宿泊プラン" height="20px"></a></li>
					<li><a href="meal.html"><img src="image/meal.svg" alt="お食事" height="20px"></a></li>
					<li><a href="room.html"><img src="image/room.svg" alt="お部屋" height="20px"></a></li>
					<li><a href="access.html"><img src="image/access.svg" alt="アクセス" height="20px"></a></li>
				</ul>
			</nav>
		</div>
	</header>

	<main class="wrapper">
		<article id="form">
			<h3><img src="image/reserve.svg" alt="ご予約" height="28px"></h3>
			<p>項目全てにご入力いただき、「送信」をクリックしてください。</p>
			<form>
				<p>
					<label>
						<span class="koumoku">プラン</span>
						<select name="plan" class="cursor">
							<option selected disabled>選択してください</option>
							<option value="1">スタンダードプラン</option>
							<option value="2">素泊まりプラン</option>
							<option value="3">連泊プラン</option>
						</select>
					</label>
				</p>
				<p>
					オプション<br>
					<small>※ご希望の場合のみ、チェックをつけてください。</small><br>
					<label class="cursor">
						<input type="checkbox" name="option" value="1" class="checkbox_icon" />アーリーチェックイン
					</label><br>
					<label class="cursor">
						<input type="checkbox" name="option" value="1" class="checkbox_icon" />レイトチェックアウト
					</label><br>
					<label class="cursor">
						<input type="checkbox" name="option" value="1" class="checkbox_icon" />お弁当
					</label><br>
					<label class="cursor">
						<input type="checkbox" name="option" value="1" class="checkbox_icon" />送迎
					</label><br>
					<label class="cursor">
						<input type="checkbox" name="option" value="1" class="checkbox_icon" />観光案内
					</label>
				</p>
				<p>
					<label>
						<span class="koumoku">チェックイン</span>
						<input type="date" name="chacl-in" required>
					</label>
				</p>
				<p>
					<label>
						<span class="koumoku">チェックアウト</span>
						<input type="date" name="chacl-out" required>
					</label>
				</p>
				<p>
					<label>
						<span class="koumoku">お名前</span>
						<input type="text" name="name" required>
					</label>
				</p>
				<p>
					<label>
						<span class="koumoku">ご住所</span>
						<input type="text" name="address" required>
					</label>
				</p>
				<p>
					<label>
						<span class="koumoku">お電話番号</span>
						<input type="text" name="name" required>
					</label>
				</p>
				<p>
					<label>
						<span class="koumoku">メールアドレス</span>
						<input type="mail" name="mail" required>
					</label>
				</p>
				<p>
					<label>
						その他、ご要望がありましたらご記入ください。<br>
						<textarea name="message"></textarea>
					</label>
				</p>
				<p id="submit">
					<input type="submit" value="送信" class="cursor" wrap="soft">
				</p>
			</form>
		</article>
	</main>

	<footer>
		<div id="footer-in" class="wrapper">
			<div id="footer-R">
				<div id="footer-logo">
					<a href="index.html"><img src="image/logo_mark.svg" alt="民宿ひより家"></a>
				</div>
				<nav>
					<ul>
						<li><a href="plan.html"><img src="image/plan_v.svg" alt="ご宿泊プラン"></a></li>
						<li><a href="meal.html"><img src="image/meal_v.svg" alt="お食事"></a></li>
						<li><a href="room.html"><img src="image/room_v.svg" alt="お部屋"></a></li>
						<li><a href="access.html"><img src="image/access_v.svg" alt="アクセス"></a></li>
						<li id="reserve-f"><a href="reserve.html"><img src="image/to_reserve_v.svg" alt="ご予約はこちら"></a></li>
					</ul>
				</nav>
			</div>
			<div id="footer-L">
				<address>
					<dl>
						<dt>住所</dt>
						<dd>000-0000<br>富山県富山市〇〇五</dd>
						<dt>電話</dt>
						<dd><a href="tel:0000-00-0000">0000-00-0000</a></dd>
					</dl>
				</address>
				<iframe
					src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3210.549974021887!2d136.47379107723913!3d36.4200819723579!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5ff851da60dd4a6d%3A0x3aa1ffc4e0c7a144!2z44OJ44Oq44O844Og44Kr44Os44OD44K4!5e0!3m2!1sja!2sjp!4v1769753811797!5m2!1sja!2sjp"
					style="border:0;" allowfullscreen="" loading="lazy"
					referrerpolicy="no-referrer-when-downgrade"></iframe>
			</div>
		</div>
	</footer>
</body>

</html>
